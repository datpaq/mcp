      description: Requires q. Resolves free-form place text to normalized matches with coordinates and confidence.
      responses:
        "200":
          description: Forward geocode matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                success: true
                count: 1
                results:
                  - lat: 38.8977
                    lon: -77.0365
                    displayName: 1600 Pennsylvania Avenue NW, Washington, DC, United States
                    type: house
                    confidence:
                      score: 0.95
                      level: high
                metadata:
                  correlationId: abc123-def456
                  timestamp: "2026-08-20T12:00:00.000Z"
                  processingTime: 64ms
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
