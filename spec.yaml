      summary: Search countries
      description: Requires q. Matches name, ISO2, ISO3, or numeric code. Limited to 25 rows.
      responses:
        "200":
          description: Matching countries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
