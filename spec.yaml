        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
      parameters:
        - name: q
          in: query
          required: true
          description: Code or country name
          schema:
            type: string
            example: United Stat
