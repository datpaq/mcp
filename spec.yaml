      operationId: webSearchSearch
      summary: Search the web for a single query
      description: Returns instant answers, related topics, and results for one query.
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
        "400":
