        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
      parameters:
        - name: country
          in: query
          required: false
          description: Comma-separated ISO2, ISO3, or country names
          schema:
            type: string
            example: US,CA
        - name: year
          in: query
          required: false
          description: Year filter
          schema:
            type: integer
            example: 2026
        - name: month
          in: query
          required: false
          description: Month 1-12
          schema:
            type: integer
            example: 12
        - name: start_date
          in: query
          required: false
          description: Range start YYYY-MM-DD
          schema:
            type: string
            example: "2026-01-01"
        - name: end_date
          in: query
          required: false
          description: Range end YYYY-MM-DD
          schema:
            type: string
            example: "2026-12-31"
        - name: format
          in: query
          required: false
          description: json or csv
          schema:
            type: string
            enum:
              - json
              - csv
            example: json
