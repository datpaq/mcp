          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                success: true
                data:
                  count: 1
                  stations:
                    - id: "12345"
                      name: Downtown ChargePoint
                      lat: 40.7128
                      lon: -74.006
                      network: ChargePoint
                      plug_types:
                        - CCS
                        - J1772
                      level: 2
                metadata:
                  correlationId: abc123-def456
                  timestamp: "2026-08-20T12:00:00.000Z"
                  processingTime: 28ms
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitude
          schema:
            type: number
            example: 40.7128
        - name: lon
          in: query
          required: true
          description: Longitude
          schema:
            type: number
            example: -74.006
        - name: radius_km
          in: query
          required: false
          description: Search radius in kilometers. Defaults to 10.
          schema:
            type: number
            example: 10
        - name: plug_type
          in: query
          required: false
          description: Plug type filter, e.g. CCS
          schema:
            type: string
            example: CCS
        - name: level
          in: query
          required: false
          description: Charging level 1, 2, or 3
          schema:
            type: integer
            example: 2
        - name: network
          in: query
          required: false
          description: Network name substring
          schema:
            type: string
            example: ChargePoint
        - name: open_now
          in: query
          required: false
          description: Filter to 24/7 hours when true
