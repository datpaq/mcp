        format=csv returns CSV. Defaults to the current year for country=US when no date filter is set.
      responses:
        "200":
          description: Holiday rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                success: true
                data:
                  - date: "2026-12-25"
