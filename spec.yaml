                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                success: true
                pdfBase64: JVBERi0xLjQK
                pdfMetadata:
                  pages: 1
                  format: A4
                metadata:
