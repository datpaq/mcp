            type: string
            example: united
  /country-codes/countries/match:
    get:
      tags:
        - Country Codes
      operationId: countryCodesMatch
      summary: Exact or fuzzy country match
      description: Requires q. Tries exact ISO/numeric match, then PostgreSQL similarity on the country name.
      responses:
        "200":
          description: Best country match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                success: true
                data:
                  name: United States
                  iso2: US
                  iso3: USA
                  numeric: "840"
                  similarity: 0.91
                metadata:
                  correlationId: abc123-def456
                  timestamp: "2026-08-20T12:00:00.000Z"
                  processingTime: 9ms
