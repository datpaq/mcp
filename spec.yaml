openapi: 3.0.3
info:
  title: Datpaq ProAPI
  description: >-
    Multi-service API platform covering the live Datpaq catalog: geocoding, EV charging, weather, aviation, holidays,
    QR/PDF generation, enrichment, and utilities. All endpoints require authentication via API key passed as an
    x-api-key header or api_key query parameter.
  version: 1.1.0
  contact:
    name: Datpaq Support
    url: https://datpaq.com
  license:
    name: Proprietary
servers:
  - url: https://datpaq.com/api/v1
    description: Production
  - url: https://staging.datpaq.com/api/v1
    description: Staging
security:
  - ApiKeyHeader: []
  - ApiKeyQuery: []
tags:
  - name: Aircraft
    description: FAA aircraft registration lookup by tail, ICAO hex, and type code
  - name: Breach Check
    description: "Email breach exposure, password k-anonymity checks, and breach catalog"
  - name: Calendar
    description: Month, day, and range calendars with optional public-holiday overlays
  - name: Color Convert
    description: "Color conversion across formats with contrast and gradient helpers"
  - name: Convert Time
    description: Timezone-aware datetime conversion
  - name: Country Codes
    description: ISO 3166-1 country lookup, search, fuzzy match, and export
  - name: Current Time
    description: Current time by IANA timezone identifier
  - name: Data Format Convert
    description: "Convert data between JSON, CSV, XML, YAML, and spreadsheet formats"
  - name: Deslop
    description: "Detect and rewrite AI writing patterns in text"
  - name: Dictionary
    description: English word definitions, phonetics, and fuzzy suggestions
  - name: Diffy
    description: "Web page snapshots and change diffs against a previous snapshot"
  - name: DNS Lookup
    description: Forward and reverse DNS resolution for domains and IP addresses
  - name: Document Convert
    description: "Convert office documents, PDF, and text formats"
  - name: Document Generation
    description: "Generate business documents (invoices, letters, forms) as PDF, DOCX, or HTML"
  - name: Domain Lookup
    description: Domain TLD classification, regional metadata, and DNS presence checks
  - name: Economic Indicators
    description: "Macroeconomic indicator catalog, series history, and interest rates"
  - name: Encoding Convert
    description: "Encode, decode, hash, JWT-decode, normalize, and data-URI conversions"
  - name: EV Charger
    description: EV charging station search, station detail, and network/plug/level reference data
  - name: GDP
    description: "US GDP levels, history, growth, and dataset comparison"
  - name: Geocoding
    description: Forward, reverse, and batch geocoding via OpenStreetMap Nominatim
  - name: Helicopter
    description: FAA rotorcraft lookup by tail, ICAO hex, serial, manufacturer, and model
  - name: IBAN
    description: "IBAN structure and mod-97 checksum validation with country metadata"
  - name: Image Processing
    description: Image resize, compress, convert, crop, and pipeline operations
  - name: Income Tax
    description: "US federal income tax estimates and brackets"
  - name: Interest Rate
    description: "Current benchmark interest rates and the Treasury yield curve"
  - name: IP Geolocation
    description: Geographic location data for IPv4 and IPv6 addresses
  - name: IP Intelligence
    description: Threat intelligence and risk scoring for IP addresses
  - name: LIBOR
    description: "SOFR-first benchmark rates with archival LIBOR history and tenor spreads"
  - name: Logo
    description: "Discover a company's logos, icons, and brand palette by domain"
  - name: Lorem Ipsum
    description: "Placeholder text generation as JSON, text, or HTML"
  - name: MAC Address
    description: MAC address vendor identification from IEEE OUI registry data
  - name: Markdown Convert
    description: "Markdown to HTML, HTML to Markdown, plaintext, and document outlines"
  - name: Market Cap
    description: "Company market capitalization lookups, history, trends, and rankings"
  - name: Mortgage Calculator
    description: "Mortgage payment, refinance break-even, and current mortgage rates"
  - name: MX Lookup
    description: Mail exchange record lookup with optional SPF and SMTP checks
  - name: OCR
    description: "Extract text from PDFs and images, with optional OCR"
  - name: PDF Generation
    description: SSRF-safe PDF rendering from a public URL or sanitized HTML
  - name: PDF Toolkit
    description: "Merge, split, extract, rotate, watermark, compress, encrypt, and inspect PDFs"
  - name: Ping Human
    description: "Escalate a decision to a human via Slack or email and collect the reply"
  - name: Profanity
    description: Content moderation and profanity detection
  - name: Public Holidays
    description: Public holiday lookup for 200+ countries with JSON or CSV output
  - name: QR Code
    description: QR code generation (PNG/SVG) and decode from a base64 image
  - name: Sample Data
    description: Mock data generation for testing and development (Faker.js)
  - name: SEC Filings
    description: "SEC EDGAR company profiles, filings, and XBRL facts"
  - name: Spell Check
    description: Multilingual spelling correction with optional grammar hints
  - name: Structured Extraction
    description: "Extract structured fields from a web page or HTML using CSS selectors"
  - name: Tech Stack Detection
    description: "Detect the technologies a website uses"
  - name: Text Language
    description: Language detection with ISO codes and confidence scores
  - name: Thesaurus
    description: Synonyms, antonyms, and related terms from WordNet
  - name: Translate
    description: "Text translation between supported languages"
  - name: Unemployment
    description: "US unemployment rates, labor force, claims, demographics, and states"
  - name: Unit Conversion
    description: Unit conversion across 100+ measurement types
  - name: US States
    description: US state list, abbreviation, FIPS, and batch abbreviation lookup
  - name: User Avatar
    description: Dynamic user avatar generation in PNG, WebP, or SVG
  - name: Validate IP
    description: IP address validation and classification (IPv4, IPv6, CIDR)
  - name: VAT Validation And Rates
    description: "VAT number validation, VAT rates by country, and VAT price calculation"
  - name: VIN Lookup
    description: NHTSA VIN decode, makes list, and prefix suggestions
  - name: Weather
    description: Normalized current conditions and forecast by latitude and longitude
  - name: Web Scraping
    description: Headless scrape, batch, crawl, and site-map extraction
  - name: Web Screenshot
    description: Web page screenshot capture via headless browser
  - name: Web Search
    description: Web search for a single query or a batch of up to 10 queries
  - name: WHOIS
    description: Domain WHOIS registration data lookup
  - name: Working Days
    description: Business day calculations with regional holiday support
paths:
  /convert-time:
    get:
      tags:
        - Convert Time
      operationId: convertTime
      summary: Convert a datetime between timezones
      description: >
        Converts a datetime value from a source timezone to a target timezone. Accepts ISO 8601 strings, Unix epoch
        timestamps, or omit sourceTime to convert the current time.
      parameters:
        - name: sourceTime
          in: query
          required: false
          description: Time to convert (ISO 8601 or Unix ms). Defaults to current time.
          schema:
            type: string
            example: "2025-12-31T12:00:00Z"
        - name: sourceZone
          in: query
          required: true
          description: Source IANA timezone identifier
          schema:
            type: string
            example: America/New_York
        - name: targetZone
          in: query
          required: true
          description: Target IANA timezone identifier
          schema:
            type: string
            example: Europe/London
      responses:
        "200":
          description: Converted datetime with timezone metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                success: true
                data:
                  base_location:
                    datetime: "2026-07-02 09:30:00"
                    timezone_name: EDT
                    timezone_location: America/New_York
                    gmt_offset: -4
                    is_dst: true
                    latitude: 40.7128
                    longitude: -74.006
                  target_location:
                    datetime: "2026-07-02 14:30:00"
                    timezone_name: BST
                    timezone_location: Europe/London
                    gmt_offset: 1
                    is_dst: true
                    latitude: 51.5074
                    longitude: -0.1278
                meta:
                  correlationId: abc123-def456
                  timestamp: "2026-07-02T13:30:00.000Z"
                  processingTime: 18ms
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /current-time:
    get:
      tags:
        - Current Time
      operationId: currentTime
      summary: Get current time for an IANA timezone
      description: Returns the current date/time with UTC offset and DST status for a given timezone.
      parameters:
        - name: target
          in: query
          required: true
          description: IANA timezone identifier (e.g. America/New_York, UTC, Asia/Tokyo)
          schema:
            type: string
            example: America/New_York
      responses:
        "200":
          description: Current time data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                success: true
                data:
                  datetime: "2026-07-02T09:30:00-04:00"
                  timezone_name: EDT
                  timezone_location: America/New_York
                  gmt_offset: -4
                  is_dst: true
                  latitude: 40.7128
                  longitude: -74.006
                meta:
                  correlationId: ghi789-jkl012
                  timestamp: "2026-07-02T13:30:00.000Z"
                  processingTime: 9ms
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /image-processing/process:
    post:
      tags:
        - Image Processing
      operationId: imagePipeline
      summary: Run an image through a multi-step operation pipeline
      description: >
        Executes an ordered array of image operations in a single request. Recommended over individual endpoints when
        multiple operations are needed. Supports resize, compress, convert, crop, and metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - image_url
                - operations
              properties:
                image_url:
                  type: string
                  format: uri
                  example: https://example.com/photo.jpg
                operations:
                  type: array
                  items:
                    type: object
                    required:
                      - operation
                    properties:
                      operation:
                        type: string
                        enum:
                          - resize
                          - compress
                          - convert
                          - crop
                          - metadata
                      width:
                        type: integer
                        minimum: 1
                      height:
                        type: integer
                        minimum: 1
                      quality:
                        type: integer
                        minimum: 1
                        maximum: 100
                      format:
                        type: string
                        enum:
                          - jpeg
                          - png
                          - webp
                          - avif
            example:
              image_url: https://example.com/photo.jpg
              operations:
                - type: resize
                  width: 800
                - type: convert
                  format: webp
      responses:
        "200":
          description: Processed image binary or JSON metadata
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /image-processing/resize:
    post:
      tags:
        - Image Processing
      operationId: imageResize
      summary: Resize an image to specified dimensions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - image_url
              properties:
                image_url:
                  type: string
                  format: uri
                width:
                  type: integer
                  example: 800
                height:
                  type: integer
                  example: 600
                fit:
                  type: string
                  enum:
                    - cover
                    - contain
                    - fill
                    - inside
                    - outside
                  default: cover
            example:
              image_url: https://example.com/photo.jpg
              width: 800
              height: 600
              fit: cover
      responses:
        "200":
          description: Resized image binary
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /image-processing/compress:
    post:
      tags:
        - Image Processing
      operationId: imageCompress
      summary: Compress an image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - image_url
              properties:
                image_url:
                  type: string
                  format: uri
                quality:
                  type: integer
                  minimum: 1
                  maximum: 100
                  example: 75
            example:
              image_url: https://example.com/photo.jpg
              quality: 80
      responses:
        "200":
          description: Compressed image binary
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /image-processing/convert:
    post:
      tags:
        - Image Processing
      operationId: imageConvert
      summary: Convert image to a different format
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - image_url
                - format
              properties:
                image_url:
                  type: string
                  format: uri
                format:
                  type: string
                  enum:
                    - jpeg
                    - png
                    - webp
                    - avif
                  example: webp
            example:
              image_url: https://example.com/photo.jpg
              format: webp
      responses:
        "200":
          description: Converted image binary
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /image-processing/crop:
    post:
      tags:
        - Image Processing
      operationId: imageCrop
      summary: Crop an image to a region
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - image_url
                - x
                - "y"
                - width
                - height
              properties:
                image_url:
                  type: string
                  format: uri
                x:
                  type: integer
                  minimum: 0
                "y":
                  type: integer
                  minimum: 0
                width:
                  type: integer
                  minimum: 1
                height:
                  type: integer
                  minimum: 1
            example:
              image_url: https://example.com/photo.jpg
              left: 0
              top: 0
              width: 400
              height: 400
      responses:
        "200":
          description: Cropped image binary
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /image-processing/metadata:
    post:
      tags:
        - Image Processing
      operationId: imageMetadata
      summary: Extract metadata from an image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - image_url
              properties:
                image_url:
                  type: string
                  format: uri
            example:
              image_url: https://example.com/photo.jpg
      responses:
        "200":
          description: Image metadata (dimensions, format, EXIF, color profile)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                success: true
                format: jpeg
                width: 1920
                height: 1080
                size: 245760
                colorSpace: srgb
                hasAlpha: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /ip-geolocation:
    get:
      tags:
        - IP Geolocation
      operationId: ipGeolocationGet
      summary: Get geographic location for an IP address
      description: |
        Returns country, region, city, coordinates, ISP, ASN, and timezone for any IPv4 or IPv6 address.
      parameters:
        - name: ip
          in: query
          required: true
          schema:
            type: string
            example: 8.8.8.8
      responses:
        "200":
          description: Geolocation data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                ip: 8.8.8.8
                location:
                  country: United States
                  region: California
                  city: Mountain View
                  latitude: 37.386
                  longitude: -122.0838
                network:
                  network: 8.8.8.0/24
                  asn: 15169
                  org: Google LLC
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags:
        - IP Geolocation
      operationId: ipGeolocationPost
      summary: Get geographic location for an IP address (POST)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ip
              properties:
                ip:
                  type: string
                  example: 8.8.8.8
            example:
              ip: 8.8.8.8
      responses:
        "200":
          description: Geolocation data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                ip: 8.8.8.8
                location:
                  country: United States
                  region: California
                  city: Mountain View
                  latitude: 37.386
                  longitude: -122.0838
                network:
                  network: 8.8.8.0/24
                  asn: 15169
                  org: Google LLC
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /ip-geolocation/batch:
    post:
      tags:
        - IP Geolocation
      operationId: ipGeolocationBatch
      summary: Batch IP geolocation lookup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ips
              properties:
                ips:
                  type: array
                  items:
                    type: string
                  maxItems: 100
                  example:
                    - 8.8.8.8
                    - 1.1.1.1
            example:
              ips:
                - 8.8.8.8
                - 1.1.1.1
                - 208.67.222.222
              include_logs: false
      responses:
        "200":
          description: Geolocation data for each IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                summary:
                  total_requested: 3
                  valid_ips: 3
                  invalid_ips: 0
                  found: 2
                  not_found: 1
                  errors: 0
                  processing_time_ms: 45
                results:
                  - ip: 8.8.8.8
                    found: true
                    location:
                      country: United States
                      region: California
                      city: Mountain View
                      latitude: 37.386
                      longitude: -122.0838
                    network:
                      network: 8.8.8.0/24
                      asn: AS15169
                      org: Google LLC
                  - ip: 1.1.1.1
                    found: true
                    location:
                      country: Australia
                      region: New South Wales
                      city: Sydney
                      latitude: -33.8688
                      longitude: 151.2093
                    network:
                      network: 1.1.1.0/24
                      asn: AS13335
                      org: Cloudflare, Inc.
                  - ip: 208.67.222.222
                    found: false
                    error: IP not found in geolocation database
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /ip-intelligence:
    get:
      tags:
        - IP Intelligence
      operationId: ipIntelligenceGet
      summary: Get threat intelligence for an IP address
      description: >
        Returns trust score, risk classification, VPN/proxy/Tor detection, datacenter detection, and threat categories.
        Omit the ip parameter to analyze the caller's IP.
      parameters:
        - name: ip
          in: query
          required: false
          description: IP to analyze. Omits to use the caller's IP.
          schema:
            type: string
            example: 8.8.8.8
      responses:
        "200":
          description: IP threat intelligence data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                ip: 203.0.113.45
                id: 1
                network: 203.0.113.0/24
                description: Example Block
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /ip-intelligence/batch:
    post:
      tags:
        - IP Intelligence
      operationId: ipIntelligenceBatch
      summary: Batch IP threat intelligence lookup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ips
              properties:
                ips:
                  type: array
                  items:
                    type: string
                  maxItems: 100
                  example:
                    - 8.8.8.8
                    - 1.1.1.1
            example:
              ips:
                - 8.8.8.8
                - 1.1.1.1
                - 208.67.222.222
      responses:
        "200":
          description: Threat intelligence for each IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                summary:
                  total_requested: 3
                  valid_ips: 3
                  invalid_ips: 0
                  found: 2
                  not_found: 1
                  errors: 0
                  processing_time_ms: 42
                results:
                  - ip: 8.8.8.8
                    found: true
                    data:
                      network: 8.8.8.0/24
                      country: United States
                      region: California
                      city: Mountain View
                      asn: AS15169
                      org: Google LLC
                  - ip: 1.1.1.1
                    found: true
                    data:
                      network: 1.1.1.0/24
                      country: Australia
                      region: New South Wales
                      city: Sydney
                      asn: AS13335
                      org: Cloudflare, Inc.
                  - ip: 208.67.222.222
                    found: false
                    error: IP not found in intelligence database
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /profanity/filter:
    get:
      tags:
        - Profanity
      operationId: profanityFilter
      summary: Filter profanity from text
      description: Replaces profane words with asterisks. Returns cleaned text.
      parameters:
        - name: text
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Filtered text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                success: true
                original: what a damn mess
                filtered: what a **** mess
                matches: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /profanity/detect:
    get:
      tags:
        - Profanity
