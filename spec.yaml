      parameters:
        - name: q
          in: query
          required: true
          description: Search query (1-256 characters)
          schema:
            type: string
            example: datpaq api
        - name: limit
          in: query
          required: false
          description: Max related topics and results per section (1-10, default 10)
          schema:
            type: integer
            example: 5
