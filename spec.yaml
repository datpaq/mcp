  /sample-data:
    get:
      tags:
        - Sample Data
      operationId: sampleDataGenerateGet
      summary: Generate sample data with query parameters
      description: GET-compatible sample data generation endpoint for scripts and browser testing.
      parameters:
        - name: type
          in: query
          required: true
          description: Schema type to generate, such as user, company, product, or transaction.
          schema:
            type: string
        - name: count
          in: query
          required: false
          description: Number of records to generate.
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: fields
          in: query
          required: false
          description: Comma-separated list of fields to include.
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: Response format.
          schema:
            type: string
            enum:
              - json
              - csv
            default: json
      responses:
        "200":
          description: Generated sample data records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                success: true
                type: user
                count: 3
                data:
                  - name: John Doe
                    email: john@example.com
                    phone: +1-555-0123
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /sample-data/schemas:
    get:
      tags:
        - Sample Data
      operationId: sampleDataSchemas
      summary: List sample data schemas
      description: Returns all available sample-data schema names with default field lists.
      responses:
        "200":
          description: Available sample-data schemas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                success: true
                schemas:
                  - user
                  - company
                  - product
                  - transaction
                  - address
                count: 5
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /ip-intelligence/batch/info:
    get:
      tags:
        - IP Intelligence
      operationId: ipIntelligenceBatchInfo
      summary: Get IP intelligence batch configuration
      description: Returns batch processing limits, example request shape, and response schema details.
      responses:
        "200":
          description: Batch processing configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                success: true
                maxBatchSize: 100
                supportedFormats:
                  - ipv4
                  - ipv6
                rateLimit: per-key
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /image-processing/info:
    get:
      tags:
        - Image Processing
      operationId: imageProcessingInfo
      summary: Get image processing service information
      description: Returns supported image operations, formats, and service metadata.
      responses:
        "200":
          description: Image processing service information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                success: true
                operations:
                  - resize
                  - compress
                  - convert
                  - crop
                  - metadata
                maxFileSize: 10MB
                supportedFormats:
                  - jpeg
                  - png
                  - webp
                  - avif
                  - heic
                  - heif
                  - svg
                  - gif
                  - tiff
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /mac-address:
    get:
      tags:
        - MAC Address
      operationId: macAddressLookup
      summary: Resolve MAC address vendor and manufacturer
      description: >
        Lookup vendor by full MAC address, 6-character OUI prefix, or organization name. Provide exactly one of mac,
        prefix, or org.
      parameters:
        - name: mac
          in: query
          required: false
          description: Full MAC address (colon, hyphen, or compact hex)
          schema:
            type: string
            example: "00:11:22:33:44:55"
        - name: prefix
          in: query
          required: false
          description: 6-character hex OUI prefix
          schema:
            type: string
            example: "001122"
        - name: org
          in: query
          required: false
          description: Organization name search (min 2 chars, max 50 results)
          schema:
            type: string
            example: Apple
      responses:
        "200":
          description: Vendor information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                - prefix: 00:1A:2B
                  organization: Cisco Systems
                  registry: MA-L
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /dns-lookup:
    get:
      tags:
        - DNS Lookup
      operationId: dnsLookup
      summary: Resolve DNS records for domains or reverse PTR for IPs
      description: >
        Forward DNS for A, AAAA, MX, TXT, NS, CNAME, and SOA records. Reverse lookup via ip for PTR. Batch domains by
        repeating the domain parameter. Default record type is A; use ALL for every supported type.
      parameters:
        - name: domain
          in: query
          required: false
          description: Domain to resolve (repeat for batch)
          schema:
            oneOf:
              - type: string
                example: example.com
              - type: array
                items:
                  type: string
        - name: ip
          in: query
          required: false
          description: IP address for reverse PTR lookup
          schema:
            type: string
            example: 8.8.8.8
        - name: type
          in: query
          required: false
          description: DNS record type
          schema:
            type: string
            enum:
              - A
              - AAAA
              - MX
              - TXT
              - NS
              - CNAME
              - SOA
              - PTR
              - ALL
            default: A
      responses:
        "200":
          description: DNS record results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                - domain: example.com
                  records:
                    MX:
                      - exchange: mail.example.com
                        priority: 10
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /domain-lookup:
    post:
      tags:
        - Domain Lookup
      operationId: domainLookupPost
      summary: Enrich domains with TLD metadata and DNS presence flags
      description: >
        Returns TLD category, region, dnsCheck booleans, and WHOIS link metadata. Single domain returns an object; batch
        array (max 50) returns an array. Invalid domains return per-item errors without failing the batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
              properties:
                domain:
                  description: Single domain string or array (max 50)
                  oneOf:
                    - type: string
                      example: stripe.com
                    - type: array
                      items:
                        type: string
                      maxItems: 50
            example:
              domain: stripe.com
      responses:
        "200":
          description: Domain enrichment data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                domain: stripe.com
                tld: com
                category: commercial
                region: Global
                dnsCheck:
                  hasA: true
                  hasAAAA: true
                  hasMX: true
                  hasTXT: true
                whois:
                  available: true
                  url: https://datpaq.com/whois?domain=stripe.com
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /mx-lookup:
    get:
      tags:
        - MX Lookup
      operationId: mxLookupGet
      summary: Look up MX records for one or more domains (GET)
      description: |
        Returns priority-sorted MX records with optional IP resolution, SMTP port 25 checks, and SPF parsing.
      parameters:
        - name: domains
          in: query
          required: true
          description: >
            Domains to check. Note the parameter name is plural (`domains`, not `domain`), even for a single domain.
            Accepts one domain or a comma-separated list (max 50).
          schema:
            type: string
            example: gmail.com
        - name: resolveIps
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: validateSmtp
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: includeSpf
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: MX lookup results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                - domain: gmail.com
                  mxRecords:
                    - priority: 5
                      exchange: gmail-smtp-in.l.google.com
                      ipAddresses:
                        - 142.250.102.27
                      smtpOpen: true
                  spf:
                    record: v=spf1 include:_spf.google.com ~all
                    includes:
                      - _spf.google.com
                    mechanism: ~all
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags:
        - MX Lookup
      operationId: mxLookupPost
      summary: Look up MX records for one or more domains (POST)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domains
              properties:
                domains:
                  oneOf:
                    - type: string
                      example: gmail.com
                    - type: array
                      items:
                        type: string
                      maxItems: 50
                resolveIps:
                  type: boolean
                  default: true
                validateSmtp:
                  type: boolean
                  default: false
                includeSpf:
                  type: boolean
                  default: false
            example:
              domains:
                - gmail.com
                - protonmail.com
              resolveIps: true
              validateSmtp: true
              includeSpf: true
      responses:
        "200":
          description: MX lookup results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"
              example:
                success: true
                count: 2
                data:
                  - domain: gmail.com
                    mxRecords:
                      - priority: 5
                        exchange: gmail-smtp-in.l.google.com
                  - domain: protonmail.com
                    mxRecords:
                      - priority: 10
                        exchange: mail.protonmail.ch
                processingTime: 12ms
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ServiceUnavailable"
  /dictionary:
