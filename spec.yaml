      tags:
        - Web Search
      operationId: webSearchBatch
      summary: Batch web search for up to 10 queries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - queries
              properties:
                queries:
                  type: array
