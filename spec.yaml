      parameters:
        - name: q
          in: query
          required: true
          description: Place text or street address
          schema:
            type: string
            example: 1600 Pennsylvania Avenue NW, Washington, DC
        - name: limit
          in: query
          required: false
          description: Max matches 1-10, default 5
          schema:
            type: integer
            example: 5
        - name: language
